services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt: ["no-new-privileges:true"]
